services:
  - type: background_worker
    name: telegram-movie-assistant
    runtime: docker
    plan: starter
    numInstances: 1
    autoDeploy: true
    envVars:
      - key: GROQ_BASE_URL
        value: https://api.groq.com
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
